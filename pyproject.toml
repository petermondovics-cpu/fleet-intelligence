[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-intelligence"
version = "0.1.0"
description = "fleet offer collection"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "petermondovics-cpu", email = "peter.mondovics@gmail.com" } ]
requires-python = ">=3.8"

dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.12",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "isort"]
